<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Совместная доска</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Первый экран: не подключены -->
    <div v-if="!isConnected" class="welcome-screen">
      <h1>Совместная доска</h1>
      <p>Создайте новую доску или подключитесь к существующей</p>
      <button @click="createBoard" :disabled="loading">
        <span v-if="loading">Создание...</span>
        <span v-else>Создать новую доску</span>
      </button>
      <div class="divider"><span>или</span></div>
      <div class="join-form">
        <input v-model="joinBoardId" placeholder="Введите ID доски" @keyup.enter="joinBoard" />
        <button @click="joinBoard" :disabled="!joinBoardId">Подключиться</button>
      </div>
      <div v-if="error" class="error">{{ error }}</div>
    </div>

    <!-- Второй экран: подключены к доске -->
    <div v-else class="board-layout">
      <div class="topbar">
        <div class="board-info">
          <span>Доска: {{ boardId }}</span>
          <span class="user-count">Пользователей: {{ connectedUsers }}</span>
        </div>
        <button @click="disconnect">Покинуть доску</button>
      </div>

      <div class="main-area">
        <div class="toolbar">
          <div class="tool-group">
            <button 
              v-for="tool in tools" 
              :key="tool.type"
              @click="selectTool(tool.type)"
              :class="['tool-btn', { active: selectedTool === tool.type }]"
            >{{ tool.label }}</button>
          </div>

          <div v-if="selectedObject" class="properties">
            <h4>Свойства</h4>
            
            <div v-if="selectedObject.type === 'text'" class="prop-row">
              <label>Текст</label>
              <textarea :value="selectedObject.text" @input="updateProp('text', $event.target.value)"></textarea>
            </div>
            
            <div class="prop-row">
              <label>Цвет</label>
              <input type="color" :value="selectedObject.color" @input="updateProp('color', $event.target.value)" />
            </div>
            
            <div v-if="selectedObject.type !== 'image' && selectedObject.type !== 'text'" class="prop-row">
              <label>Заливка</label>
              <input type="color" :value="selectedObject.fillColor" @input="updateProp('fillColor', $event.target.value)" />
            </div>
            
            <div v-if="selectedObject.type !== 'image'" class="prop-row">
              <label>Толщина линии: {{ selectedObject.lineWidth }}</label>
              <input type="range" :value="selectedObject.lineWidth" @input="updateProp('lineWidth', Number($event.target.value))" min="1" max="20" />
            </div>
            
            <div class="prop-row">
              <label>Ширина</label>
              <input type="number" :value="selectedObject.width" @input="updateProp('width', Number($event.target.value))" min="10" />
            </div>
            
            <div class="prop-row">
              <label>Высота</label>
              <input type="number" :value="selectedObject.height" @input="updateProp('height', Number($event.target.value))" min="10" />
            </div>
            
            <button @click="deleteSelected" class="btn-delete">Удалить объект</button>
          </div>

          <div v-else class="properties">
            <p style="font-size: 12px; color: #999;">Выберите объект для редактирования</p>
          </div>
        </div>
        <div class="canvas-container" ref="canvasContainer">
          <canvas 
            ref="canvas"
            @mousedown="onMouseDown"
            @mousemove="onMouseMove"
            @mouseup="onMouseUp"
          ></canvas>
        </div>
      </div>
      <div class="statusbar">Статус: {{ statusMessage }}</div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          socket: null,
          isConnected: false,
          boardId: null,
          joinBoardId: '',
          connectedUsers: 0,
          loading: false,
          error: null,
          statusMessage: 'Нет подключения',
          objects: [],

          selectedTool: 'rectangle',
          tools: [
            { type: 'select', label: 'Выбор' },
            { type: 'rectangle', label: 'Прямоугольник' },
            { type: 'circle', label: 'Круг' },
            { type: 'triangle', label: 'Треугольник' },
            { type: 'line', label: 'Линия' },
            { type: 'text', label: 'Текст' },
            { type: 'image', label: 'Изображение' }
          ],

          selectedObject: null,
          selectedObjectId: null,

          isDragging: false,
          dragStartX: 0,
          dragStartY: 0,
          dragObjectStartX: 0,
          dragObjectStartY: 0,

          isDrawing: false,
          drawStartX: 0,
          drawStartY: 0
        };
      },

      methods: {
        async createBoard() {
          this.loading = true;
          this.error = null;
          try {
            const res = await fetch('http://localhost:3000/api/board', { method: 'POST' });
            const data = await res.json();
            if (data.boardId) {
              this.connectToBoard(data.boardId);
            } else {
              this.error = 'Не удалось создать доску';
            }
          } catch (e) {
            this.error = 'Сервер недоступен';
          }
          this.loading = false;
        },

        joinBoard() {
          if (this.joinBoardId) this.connectToBoard(this.joinBoardId);
        },

        connectToBoard(boardId) {
          this.boardId = boardId;
          this.socket = io('http://localhost:3000');

          this.socket.on('connect', () => {
            this.isConnected = true;
            this.statusMessage = 'Подключено';
            this.socket.emit('board:join', boardId);
          });

          this.socket.on('board:state', (state) => {
            this.objects = state.objects || [];
            this.connectedUsers = state.connectedUsers;
            this.drawCanvas();
          });

          this.socket.on('object:created', (object) => {
            this.objects.push(object);
            this.drawCanvas();
          });

          this.socket.on('object:updated', (updatedObject) => {
            const index = this.objects.findIndex(o => o.id === updatedObject.id);
            if (index !== -1) this.objects[index] = updatedObject;
            if (this.selectedObjectId === updatedObject.id) {
              this.selectedObject = { ...updatedObject };
            }
            this.drawCanvas();
          });

          this.socket.on('object:moved', (data) => {
            const obj = this.objects.find(o => o.id === data.objectId);
            if (obj) { obj.x = data.x; obj.y = data.y; }
            if (this.selectedObjectId === data.objectId) {
              this.selectedObject = { ...obj };
            }
            this.drawCanvas();
          });

          this.socket.on('object:deleted', (objectId) => {
            this.objects = this.objects.filter(o => o.id !== objectId);
            if (this.selectedObjectId === objectId) {
              this.selectedObject = null;
              this.selectedObjectId = null;
            }
            this.drawCanvas();
          });

          this.socket.on('user:joined', (data) => {
            this.connectedUsers = data.totalUsers;
          });

          this.socket.on('user:left', (data) => {
            this.connectedUsers = data.totalUsers;
          });

          this.socket.on('error', (data) => {
            this.statusMessage = 'Ошибка: ' + data.message;
          });

          this.socket.on('disconnect', () => {
            this.statusMessage = 'Отключено';
          });
        },

        disconnect() {
          if (this.socket) this.socket.disconnect();
          this.isConnected = false;
          this.boardId = null;
          this.objects = [];
          this.selectedObject = null;
          this.selectedObjectId = null;
          this.connectedUsers = 0;
          this.statusMessage = 'Нет подключения';
        },

        selectTool(tool) {
          this.selectedTool = tool;
          this.selectedObject = null;
          this.selectedObjectId = null;
          this.drawCanvas();
        },

        updateProp(prop, value) {
          if (!this.selectedObjectId) return;
          const updates = {};
          updates[prop] = value;
          this.socket.emit('object:update', {
            boardId: this.boardId,
            objectId: this.selectedObjectId,
            updates: updates
          });
        },

        deleteSelected() {
          if (!this.selectedObjectId) return;
          this.socket.emit('object:delete', {
            boardId: this.boardId,
            objectId: this.selectedObjectId
          });
        },

        getCanvasCoords(e) {
          const canvas = this.$refs.canvas;
          const rect = canvas.getBoundingClientRect();
          return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
          };
        },

        findObjectAt(x, y) {
          for (let i = this.objects.length - 1; i >= 0; i--) {
            const obj = this.objects[i];
            if (x >= obj.x && x <= obj.x + obj.width && y >= obj.y && y <= obj.y + obj.height) {
              return obj;
            }
          }
          return null;
        },

        onMouseDown(e) {
          if (e.button !== 0) return;
          const coords = this.getCanvasCoords(e);

          if (this.selectedTool === 'select') {
            const clicked = this.findObjectAt(coords.x, coords.y);
            if (clicked) {
              this.selectedObject = { ...clicked };
              this.selectedObjectId = clicked.id;
              this.isDragging = true;
              this.dragStartX = coords.x;
              this.dragStartY = coords.y;
              this.dragObjectStartX = clicked.x;
              this.dragObjectStartY = clicked.y;
            } else {
              this.selectedObject = null;
              this.selectedObjectId = null;
            }
          } else {
            this.isDrawing = true;
            this.drawStartX = coords.x;
            this.drawStartY = coords.y;
            this.selectedObject = null;
            this.selectedObjectId = null;
          }
          this.drawCanvas();
        },

        onMouseMove(e) {
          const coords = this.getCanvasCoords(e);

          if (this.isDragging) {
            const dx = coords.x - this.dragStartX;
            const dy = coords.y - this.dragStartY;
            this.socket.emit('object:move', {
              boardId: this.boardId,
              objectId: this.selectedObjectId,
              x: this.dragObjectStartX + dx,
              y: this.dragObjectStartY + dy
            });
            const obj = this.objects.find(o => o.id === this.selectedObjectId);
            if (obj) {
              obj.x = this.dragObjectStartX + dx;
              obj.y = this.dragObjectStartY + dy;
            }
          }

          if (this.isDrawing) {
            this.drawCanvas();
            const ctx = this.$refs.canvas.getContext('2d');
            ctx.strokeStyle = '#0000ff';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            const x = Math.min(this.drawStartX, coords.x);
            const y = Math.min(this.drawStartY, coords.y);
            const w = Math.abs(coords.x - this.drawStartX);
            const h = Math.abs(coords.y - this.drawStartY);

            if (this.selectedTool === 'rectangle') {
              ctx.strokeRect(x, y, w, h);
            } else if (this.selectedTool === 'circle') {
              const radius = Math.sqrt(w * w + h * h);
              ctx.beginPath();
              ctx.arc(this.drawStartX, this.drawStartY, radius, 0, Math.PI * 2);
              ctx.stroke();
            } else if (this.selectedTool === 'line') {
              ctx.beginPath();
              ctx.moveTo(this.drawStartX, this.drawStartY);
              ctx.lineTo(coords.x, coords.y);
              ctx.stroke();
            } else if (this.selectedTool === 'triangle') {
              ctx.beginPath();
              ctx.moveTo(this.drawStartX, this.drawStartY + h);
              ctx.lineTo(this.drawStartX + w / 2, this.drawStartY);
              ctx.lineTo(this.drawStartX + w, this.drawStartY + h);
              ctx.closePath();
              ctx.stroke();
            }
            ctx.setLineDash([]);
          }
        },

        onMouseUp(e) {
          if (this.isDragging) {
            this.isDragging = false;
            return;
          }
          if (!this.isDrawing) return;
          this.isDrawing = false;

          const coords = this.getCanvasCoords(e);
          let x = Math.min(this.drawStartX, coords.x);
          let y = Math.min(this.drawStartY, coords.y);
          let w = Math.abs(coords.x - this.drawStartX);
          let h = Math.abs(coords.y - this.drawStartY);

          if (w < 5 && h < 5 && this.selectedTool !== 'line') return;
          if (w < 5) w = 100;
          if (h < 5) h = 100;

          const objectData = {
            type: this.selectedTool,
            x: x, y: y,
            width: w, height: h,
            color: '#000000',
            lineWidth: 2,
            fillColor: '#ffffff'
          };

          if (this.selectedTool === 'text') {
            objectData.text = 'Введите текст';
            objectData.fontSize = 16;
          } else if (this.selectedTool === 'circle') {
            const radius = Math.sqrt(w * w + h * h);
            objectData.x = this.drawStartX - radius;
            objectData.y = this.drawStartY - radius;
            objectData.width = radius * 2;
            objectData.height = radius * 2;
          } else if (this.selectedTool === 'image') {
            const url = prompt('Введите URL изображения:');
            if (!url) return;
            objectData.imageUrl = url;
            objectData.fillColor = null;
          }

          this.socket.emit('object:create', {
            boardId: this.boardId,
            object: objectData
          });
        },

        drawCanvas() {
          const canvas = this.$refs.canvas;
          if (!canvas) return;
          const container = this.$refs.canvasContainer;
          canvas.width = container.clientWidth;
          canvas.height = container.clientHeight;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          this.objects.forEach(obj => {
            ctx.save();
            ctx.strokeStyle = obj.color || '#000000';
            ctx.fillStyle = obj.fillColor || '#ffffff';
            ctx.lineWidth = obj.lineWidth || 2;

            if (obj.type === 'rectangle') {
              if (obj.fillColor) ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
              ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
            } else if (obj.type === 'circle') {
              ctx.beginPath();
              const cx = obj.x + obj.width / 2;
              const cy = obj.y + obj.height / 2;
              ctx.ellipse(cx, cy, Math.abs(obj.width / 2), Math.abs(obj.height / 2), 0, 0, Math.PI * 2);
              if (obj.fillColor) ctx.fill();
              ctx.stroke();
            } else if (obj.type === 'triangle') {
              ctx.beginPath();
              ctx.moveTo(obj.x + obj.width / 2, obj.y);
              ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
              ctx.lineTo(obj.x, obj.y + obj.height);
              ctx.closePath();
              if (obj.fillColor) ctx.fill();
              ctx.stroke();
            } else if (obj.type === 'line') {
              ctx.beginPath();
              ctx.moveTo(obj.x, obj.y);
              ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
              ctx.stroke();
            } else if (obj.type === 'text') {
              ctx.fillStyle = obj.color || '#000000';
              ctx.font = (obj.fontSize || 16) + 'px Arial';
              ctx.textBaseline = 'top';
              ctx.fillText(obj.text || '', obj.x, obj.y);
            } else if (obj.type === 'image') {
              if (obj.imageUrl) {
                const img = new Image();
                img.src = obj.imageUrl;
                if (img.complete) {
                  ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
                } else {
                  ctx.fillStyle = '#e0e0e0';
                  ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                  img.onload = () => this.drawCanvas();
                }
              }
              ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
            }
            ctx.restore();
          });

          if (this.selectedObjectId) {
            const selObj = this.objects.find(o => o.id === this.selectedObjectId);
            if (selObj) {
              ctx.strokeStyle = '#0066ff';
              ctx.lineWidth = 2;
              ctx.setLineDash([5, 5]);
              ctx.strokeRect(selObj.x - 5, selObj.y - 5, selObj.width + 10, selObj.height + 10);
              ctx.setLineDash([]);
            }
          }
        }
      },

      mounted() {
        window.addEventListener('resize', () => this.drawCanvas());
      },

      beforeUnmount() {
        if (this.socket) {
          this.socket.disconnect();
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
