<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Совместная доска</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <div v-if="!isConnected" class="welcome-screen">
      <h1>Совместная доска</h1>
      <button v-on:click="createBoard">Создать новую доску</button>
      <p v-if="boardId">Доска создана: {{ boardId }}</p>
      <p v-if="error" style="color: red;">{{ error }}</p>
    </div>

    <div v-else class="board-layout">
      <div class="topbar">
        <span>Доска: {{ boardId }}</span>
        <span>Пользователей: {{ connectedUsers }}</span>
        <button v-on:click="disconnect">Покинуть доску</button>
      </div>
      <div class="canvas-container" ref="canvasContainer">
        <canvas ref="canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        socket: null,
        isConnected: false,
        boardId: null,
        connectedUsers: 0,
        error: null,
        objects: []
      };
    },

    methods: {
      async createBoard() {
        this.error = null;
        try {
          const res = await fetch('http://localhost:3000/api/board', {
            method: 'POST'
          });
          const data = await res.json();
          if (data.boardId) {
            this.connectToBoard(data.boardId);
          } else {
            this.error = 'Не удалось создать доску';
          }
        } catch (e) {
          this.error = 'Сервер недоступен';
        }
      },

      connectToBoard(boardId) {
        this.boardId = boardId;
        this.socket = io('http://localhost:3000');

        this.socket.on('connect', function() {
          this.isConnected = true;
          this.socket.emit('board:join', boardId);
        }.bind(this));

        this.socket.on('board:state', function(state) {
          this.objects = state.objects || [];
          this.connectedUsers = state.connectedUsers;
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:created', function(object) {
          this.objects.push(object);
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:updated', function(updatedObject) {
          var index = this.objects.findIndex(function(o) {
            return o.id === updatedObject.id;
          });
          if (index !== -1) {
            this.objects[index] = updatedObject;
          }
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:moved', function(data) {
          var obj = this.objects.find(function(o) {
            return o.id === data.objectId;
          });
          if (obj) {
            obj.x = data.x;
            obj.y = data.y;
          }
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:deleted', function(objectId) {
          this.objects = this.objects.filter(function(o) {
            return o.id !== objectId;
          });
          this.drawCanvas();
        }.bind(this));

        this.socket.on('user:joined', function(data) {
          this.connectedUsers = data.totalUsers;
        }.bind(this));

        this.socket.on('user:left', function(data) {
          this.connectedUsers = data.totalUsers;
        }.bind(this));

        this.socket.on('disconnect', function() {
          this.isConnected = false;
        }.bind(this));
      },

      disconnect() {
        if (this.socket) this.socket.disconnect();
        this.isConnected = false;
        this.boardId = null;
        this.objects = [];
        this.connectedUsers = 0;
      },

      drawCanvas() {
        var canvas = this.$refs.canvas;
        if (!canvas) return;

        var container = this.$refs.canvasContainer;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        var self = this;

        this.objects.forEach(function(obj) {
          ctx.save();
          ctx.strokeStyle = obj.color || '#000000';
          ctx.fillStyle = obj.fillColor || '#ffffff';
          ctx.lineWidth = obj.lineWidth || 2;

          if (obj.type === 'rectangle') {
            if (obj.fillColor) ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

          } else if (obj.type === 'circle') {
            ctx.beginPath();
            var cx = obj.x + obj.width / 2;
            var cy = obj.y + obj.height / 2;
            ctx.ellipse(cx, cy, Math.abs(obj.width/2), Math.abs(obj.height/2), 0, 0, Math.PI * 2);
            if (obj.fillColor) ctx.fill();
            ctx.stroke();

          } else if (obj.type === 'triangle') {
            ctx.beginPath();
            ctx.moveTo(obj.x + obj.width / 2, obj.y);
            ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
            ctx.lineTo(obj.x, obj.y + obj.height);
            ctx.closePath();
            if (obj.fillColor) ctx.fill();
            ctx.stroke();

          } else if (obj.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y);
            ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
            ctx.stroke();

          } else if (obj.type === 'text') {
            ctx.fillStyle = obj.color || '#000000';
            ctx.font = (obj.fontSize || 16) + 'px Arial';
            ctx.textBaseline = 'top';
            var words = (obj.text || '').split(' ');
            var line = '';
            var lineY = obj.y;
            words.forEach(function(word) {
              var testLine = line + word + ' ';
              if (ctx.measureText(testLine).width > (obj.width || 200) && line !== '') {
                ctx.fillText(line, obj.x, lineY);
                line = word + ' ';
                lineY += (obj.fontSize || 16) * 1.2;
              } else {
                line = testLine;
              }
            });
            ctx.fillText(line, obj.x, lineY);

          } else if (obj.type === 'image') {
            if (obj.imageUrl) {
              var img = new Image();
              img.src = obj.imageUrl;
              if (img.complete) {
                ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
              } else {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                img.onload = function() {
                  self.drawCanvas();
                };
              }
            }
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
          }

          ctx.restore();
        });
      }
    },

    mounted() {
      var self = this;
      window.addEventListener('resize', function() {
        self.drawCanvas();
      });
    }
  }).mount('#app');
  </script>
</body>
</html>
