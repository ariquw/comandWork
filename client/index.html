<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Совместная доска</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <div id="app">
    <div v-if="!isConnected" class="welcome-screen">
      <h1>Совместная доска</h1>
      <button v-on:click="createBoard">Создать новую доску</button>
      <p v-if="boardId">Доска создана: {{ boardId }}</p>
      <p v-if="error" style="color: red;">{{ error }}</p>
    </div>

    <div v-else class="board-layout">
      <div class="topbar">
        <span>Доска: {{ boardId }}</span>
        <span>Пользователей: {{ connectedUsers }}</span>
        <button v-on:click="disconnect">Покинуть доску</button>
      </div>
      <div class="canvas-container" ref="canvasContainer">
        <canvas 
          ref="canvas"
          v-on:mousedown="onMouseDown"
          v-on:mousemove="onMouseMove"
          v-on:mouseup="onMouseUp"
        ></canvas>
      </div>
    </div>
  </div>

  <script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        socket: null,
        isConnected: false,
        boardId: null,
        connectedUsers: 0,
        error: null,
        objects: [],

        selectedTool: 'rectangle',
        selectedObjectId: null,

        isDragging: false,
        dragStartX: 0,
        dragStartY: 0,
        dragObjectStartX: 0,
        dragObjectStartY: 0,

        isDrawing: false,
        drawStartX: 0,
        drawStartY: 0
      };
    },

    methods: {
      async createBoard() {
        this.error = null;
        try {
          const res = await fetch('http://localhost:3000/api/board', {
            method: 'POST'
          });
          const data = await res.json();
          if (data.boardId) {
            this.connectToBoard(data.boardId);
          } else {
            this.error = 'Не удалось создать доску';
          }
        } catch (e) {
          this.error = 'Сервер недоступен';
        }
      },

      connectToBoard(boardId) {
        this.boardId = boardId;
        this.socket = io('http://localhost:3000');

        this.socket.on('connect', function() {
          this.isConnected = true;
          this.socket.emit('board:join', boardId);
        }.bind(this));

        this.socket.on('board:state', function(state) {
          this.objects = state.objects || [];
          this.connectedUsers = state.connectedUsers;
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:created', function(object) {
          this.objects.push(object);
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:updated', function(updatedObject) {
          var index = this.objects.findIndex(function(o) {
            return o.id === updatedObject.id;
          });
          if (index !== -1) {
            this.objects[index] = updatedObject;
          }
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:moved', function(data) {
          var obj = this.objects.find(function(o) {
            return o.id === data.objectId;
          });
          if (obj) {
            obj.x = data.x;
            obj.y = data.y;
          }
          this.drawCanvas();
        }.bind(this));

        this.socket.on('object:deleted', function(objectId) {
          this.objects = this.objects.filter(function(o) {
            return o.id !== objectId;
          });
          if (this.selectedObjectId === objectId) {
            this.selectedObjectId = null;
          }
          this.drawCanvas();
        }.bind(this));

        this.socket.on('user:joined', function(data) {
          this.connectedUsers = data.totalUsers;
        }.bind(this));

        this.socket.on('user:left', function(data) {
          this.connectedUsers = data.totalUsers;
        }.bind(this));

        this.socket.on('disconnect', function() {
          this.isConnected = false;
        }.bind(this));
      },

      disconnect() {
        if (this.socket) this.socket.disconnect();
        this.isConnected = false;
        this.boardId = null;
        this.objects = [];
        this.selectedObjectId = null;
        this.connectedUsers = 0;
      },

      getCanvasCoords(e) {
        var canvas = this.$refs.canvas;
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      },

      findObjectAt(x, y) {
        for (var i = this.objects.length - 1; i >= 0; i--) {
          var obj = this.objects[i];
          if (x >= obj.x && x <= obj.x + obj.width &&
              y >= obj.y && y <= obj.y + obj.height) {
            return obj;
          }
        }
        return null;
      },

      onMouseDown(e) {
        if (e.button !== 0) return;
        var coords = this.getCanvasCoords(e);

        if (this.selectedTool === 'select') {
          var clicked = this.findObjectAt(coords.x, coords.y);
          if (clicked) {
            this.selectedObjectId = clicked.id;
            this.isDragging = true;
            this.dragStartX = coords.x;
            this.dragStartY = coords.y;
            this.dragObjectStartX = clicked.x;
            this.dragObjectStartY = clicked.y;
          } else {
            this.selectedObjectId = null;
          }
        } else {
          this.isDrawing = true;
          this.drawStartX = coords.x;
          this.drawStartY = coords.y;
          this.selectedObjectId = null;
        }
        this.drawCanvas();
      },

      onMouseMove(e) {
        var coords = this.getCanvasCoords(e);

        if (this.isDragging) {
          var dx = coords.x - this.dragStartX;
          var dy = coords.y - this.dragStartY;
          this.socket.emit('object:move', {
            boardId: this.boardId,
            objectId: this.selectedObjectId,
            x: this.dragObjectStartX + dx,
            y: this.dragObjectStartY + dy
          });
          var obj = this.objects.find(function(o) {
            return o.id === this.selectedObjectId;
          }.bind(this));
          if (obj) {
            obj.x = this.dragObjectStartX + dx;
            obj.y = this.dragObjectStartY + dy;
          }
        }

        if (this.isDrawing) {
          this.drawCanvas();
          var canvas = this.$refs.canvas;
          var ctx = canvas.getContext('2d');
          ctx.strokeStyle = '#0000ff';
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 5]);
          var x = Math.min(this.drawStartX, coords.x);
          var y = Math.min(this.drawStartY, coords.y);
          var w = Math.abs(coords.x - this.drawStartX);
          var h = Math.abs(coords.y - this.drawStartY);

          if (this.selectedTool === 'rectangle') {
            ctx.strokeRect(x, y, w, h);
          } else if (this.selectedTool === 'circle') {
            var radius = Math.sqrt(w*w + h*h);
            ctx.beginPath();
            ctx.arc(this.drawStartX, this.drawStartY, radius, 0, Math.PI * 2);
            ctx.stroke();
          } else if (this.selectedTool === 'line') {
            ctx.beginPath();
            ctx.moveTo(this.drawStartX, this.drawStartY);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
          } else if (this.selectedTool === 'triangle') {
            ctx.beginPath();
            ctx.moveTo(this.drawStartX, this.drawStartY + h);
            ctx.lineTo(this.drawStartX + w/2, this.drawStartY);
            ctx.lineTo(this.drawStartX + w, this.drawStartY + h);
            ctx.closePath();
            ctx.stroke();
          }
          ctx.setLineDash([]);
        }
      },

      onMouseUp(e) {
        if (this.isDragging) {
          this.isDragging = false;
          return;
        }

        if (this.isDrawing) {
          this.isDrawing = false;
          var coords = this.getCanvasCoords(e);
          var x = Math.min(this.drawStartX, coords.x);
          var y = Math.min(this.drawStartY, coords.y);
          var w = Math.abs(coords.x - this.drawStartX);
          var h = Math.abs(coords.y - this.drawStartY);

          if (w < 5 && h < 5 && this.selectedTool !== 'line') return;
          if (w < 5) w = 100;
          if (h < 5) h = 100;

          var objectData = {
            type: this.selectedTool,
            x: x,
            y: y,
            width: w,
            height: h,
            color: '#000000',
            lineWidth: 2,
            fillColor: '#ffffff'
          };

          if (this.selectedTool === 'text') {
            objectData.text = 'Введите текст';
            objectData.fontSize = 16;
          } else if (this.selectedTool === 'circle') {
            var radius = Math.sqrt(w*w + h*h);
            objectData.x = this.drawStartX - radius;
            objectData.y = this.drawStartY - radius;
            objectData.width = radius * 2;
            objectData.height = radius * 2;
          }

          this.socket.emit('object:create', {
            boardId: this.boardId,
            object: objectData
          });
        }
      },

      drawCanvas() {
        var canvas = this.$refs.canvas;
        if (!canvas) return;

        var container = this.$refs.canvasContainer;
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        var self = this;

        this.objects.forEach(function(obj) {
          ctx.save();
          ctx.strokeStyle = obj.color || '#000000';
          ctx.fillStyle = obj.fillColor || '#ffffff';
          ctx.lineWidth = obj.lineWidth || 2;

          if (obj.type === 'rectangle') {
            if (obj.fillColor) ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

          } else if (obj.type === 'circle') {
            ctx.beginPath();
            var cx = obj.x + obj.width / 2;
            var cy = obj.y + obj.height / 2;
            ctx.ellipse(cx, cy, Math.abs(obj.width/2), Math.abs(obj.height/2), 0, 0, Math.PI * 2);
            if (obj.fillColor) ctx.fill();
            ctx.stroke();

          } else if (obj.type === 'triangle') {
            ctx.beginPath();
            ctx.moveTo(obj.x + obj.width / 2, obj.y);
            ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
            ctx.lineTo(obj.x, obj.y + obj.height);
            ctx.closePath();
            if (obj.fillColor) ctx.fill();
            ctx.stroke();

          } else if (obj.type === 'line') {
            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y);
            ctx.lineTo(obj.x + obj.width, obj.y + obj.height);
            ctx.stroke();

          } else if (obj.type === 'text') {
            ctx.fillStyle = obj.color || '#000000';
            ctx.font = (obj.fontSize || 16) + 'px Arial';
            ctx.textBaseline = 'top';
            var words = (obj.text || '').split(' ');
            var line = '';
            var lineY = obj.y;
            words.forEach(function(word) {
              var testLine = line + word + ' ';
              if (ctx.measureText(testLine).width > (obj.width || 200) && line !== '') {
                ctx.fillText(line, obj.x, lineY);
                line = word + ' ';
                lineY += (obj.fontSize || 16) * 1.2;
              } else {
                line = testLine;
              }
            });
            ctx.fillText(line, obj.x, lineY);

          } else if (obj.type === 'image') {
            if (obj.imageUrl) {
              var img = new Image();
              img.src = obj.imageUrl;
              if (img.complete) {
                ctx.drawImage(img, obj.x, obj.y, obj.width, obj.height);
              } else {
                ctx.fillStyle = '#e0e0e0';
                ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
                img.onload = function() {
                  self.drawCanvas();
                };
              }
            }
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
          }

          ctx.restore();
        });

        if (this.selectedObjectId) {
          var selObj = this.objects.find(function(o) {
            return o.id === this.selectedObjectId;
          }.bind(this));
          if (selObj) {
            ctx.strokeStyle = '#0066ff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(selObj.x - 5, selObj.y - 5, selObj.width + 10, selObj.height + 10);
            ctx.setLineDash([]);
          }
        }
      }
    },

    mounted() {
      var self = this;
      window.addEventListener('resize', function() {
        self.drawCanvas();
      });
    }
  }).mount('#app');
  </script>
</body>
</html>
